<!doctype html>
<!--
  promo.html — prototype 影片舞台（只在 dev server 跑，不會進 dist）
  用法：npm run dev → 開 http://localhost:5173/promo.html
  中間是 iframe 載入真的網站（/），自動從頭捲到底並循環；外面是辦公室背景。
  想換背景：把照片放到 public/office.jpg 就會自動吃到，沒放就用 CSS 畫的辦公室。
-->
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<title>MoJo King — Prototype 影片</title>
<style>
  :root{
    --w: 1440;            /* iframe 的虛擬視窗寬 */
    --h: 900;             /* iframe 的虛擬視窗高 */
    --s: 1;               /* JS 算出來的縮放 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0d0f12;overflow:hidden;
    font-family:"Rubik",system-ui,"Noto Sans TC",sans-serif}

  /* 舞台固定 16:9，錄下來就是乾淨的影片比例 */
  .stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}

  /* 背景：有 /office.jpg 就用照片，沒有就退回下面這層 CSS 辦公室 */
  /* 由上往下找第一張讀得到的圖：自訂照片 → 首頁 Hero 的辦公室照 → 純 CSS 漸層 */
  .bg{position:absolute;inset:-4%;background:
      url("/office.jpg") center/cover no-repeat,
      url("/src/assets/Test.png") center/cover no-repeat,
      radial-gradient(120% 80% at 18% 0%, #f3ece1 0%, #cfd6d3 42%, #8f9a97 70%, #4a534f 100%);
    filter:saturate(.95) brightness(.62) blur(3px);
    transform:scale(1.06)}
  .bg::after{content:"";position:absolute;inset:0;background:
      radial-gradient(60% 45% at 50% 52%, rgba(0,0,0,.42), transparent 70%),
      linear-gradient(to top, rgba(10,12,14,.75) 0%, transparent 45%)}

  /* 瀏覽器外框 */
  .browser{position:relative;width:64vw;min-width:720px;border-radius:14px;
    background:#fff;overflow:hidden;
    box-shadow:0 60px 120px -30px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.14);
    opacity:0;transform:translateY(18px) scale(.985);
    animation:in 1.1s .25s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes in{to{opacity:1;transform:none}}

  .chrome{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#f2f2f3;
    border-bottom:1px solid rgba(0,0,0,.07)}
  .dot{width:11px;height:11px;border-radius:50%;background:#dcdcdf}
  .url{flex:1;margin-left:10px;height:24px;border-radius:6px;background:#fff;
    display:flex;align-items:center;padding:0 10px;font-size:12px;color:#7a7a80;
    border:1px solid rgba(0,0,0,.06)}

  /* 視窗：把 1440x900 的 iframe 等比縮進來 */
  .viewport{position:relative;overflow:hidden;
    height:calc(var(--h) * 1px * var(--s))}
  iframe{width:calc(var(--w) * 1px);height:calc(var(--h) * 1px);border:0;display:block;
    transform:scale(var(--s));transform-origin:0 0}

  .rec{position:fixed;right:18px;bottom:18px;z-index:9;padding:10px 16px;border:0;
    border-radius:999px;background:#1c4dff;color:#fff;font:500 13px/1 inherit;cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,.4)}
  body.recording .rec{display:none}
</style>
</head>
<body>
  <div class="stage">
    <div class="bg"></div>
    <div class="browser">
      <div class="chrome">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="url">www.mojo-king.com</span>
      </div>
      <div class="viewport"><iframe id="site" src="/" title="MoJo King"></iframe></div>
    </div>
  </div>
  <button class="rec" id="rec">● 錄成影片</button>

<script>
const HOLD_TOP    = 1800;   // 開頭停留（毫秒）
const SCROLL_TIME = 36000;  // 從頭捲到底要多久（首頁約 12000px，太快會看不清內容）
const HOLD_BOTTOM = 2200;   // 結尾停留

const frame = document.querySelector('.browser');
const iframe = document.getElementById('site');

// 外框寬度變了就重算縮放，讓 1440x900 的畫面剛好塞滿
const fit = () => document.documentElement.style
  .setProperty('--s', frame.clientWidth / 1440);
new ResizeObserver(fit).observe(frame);
fit();

const sleep = ms => new Promise(r => setTimeout(r, ms));
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

/**
 * 等 Loader 跑完、ScrollTrigger 註冊完，頁面高度才會是最終值。
 * 用「連續幾次量到同樣高度」判斷穩定，比寫死 setTimeout 可靠。
 */
async function waitForPage(win){
  const mine = gen;
  let last = -1, stable = 0;
  while (stable < 8 && mine === gen) {
    await sleep(250);
    const h = win.document.documentElement.scrollHeight;
    stable = (h === last && h > win.innerHeight * 2) ? stable + 1 : 0;
    last = h;
  }
  return last - win.innerHeight;
}

/**
 * 直接設 scrollY。Lenis 會從原生 scroll 事件同步回它自己的位置，
 * 所以不用去拿 iframe 裡的 Lenis 實例，ScrollTrigger 也照樣跟著跑。
 */
function scrollTo(win, distance, ms){
  const mine = gen;
  return new Promise(done => {
    const t0 = performance.now();
    (function step(now){
      if (mine !== gen) return done();
      const p = Math.min(1, (now - t0) / ms);
      win.scrollTo(0, distance * easeInOut(p));
      p < 1 ? requestAnimationFrame(step) : done();
    })(t0);
  });
}

async function playOnce(){
  const mine = gen;
  const win = iframe.contentWindow;
  const distance = await waitForPage(win);
  if (mine !== gen) return;
  win.scrollTo(0, 0);
  await sleep(HOLD_TOP);
  await scrollTo(win, distance, SCROLL_TIME);
  if (mine !== gen) return;
  await sleep(HOLD_BOTTOM);
}

const waitLoad = () => new Promise(r => iframe.addEventListener('load', r, { once: true }));

// 影片裡不要出現捲軸。同源才做得到，所以直接往 iframe 塞一段樣式
iframe.addEventListener('load', () => {
  const st = iframe.contentDocument.createElement('style');
  st.textContent = 'html{scrollbar-width:none}::-webkit-scrollbar{display:none}';
  iframe.contentDocument.head.appendChild(st);
});

// 每次「重來」就加一，正在跑的那一輪看到號碼變了就自己收工，不用另外寫取消邏輯
let gen = 0;
const restart = async () => {
  gen++;
  const loaded = waitLoad();
  iframe.contentWindow.location.reload();
  await loaded;
};

let recorder = null, wantRec = false;

async function driver(){
  await waitLoad();
  for (;;) {
    if (wantRec) { wantRec = false; recorder.start(); }
    await playOnce();
    if (recorder && recorder.state === 'recording') recorder.stop();
    await restart();
  }
}
driver();

// 錄影：用瀏覽器原生的畫面擷取，選「這個分頁」，錄完自動下載 webm
document.getElementById('rec').onclick = async () => {
  const stream = await navigator.mediaDevices.getDisplayMedia({
    video: { frameRate: 60 }, audio: false, preferCurrentTab: true,
  });
  recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 12e6 });
  const chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    document.body.classList.remove('recording');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = 'mojo-king-promo.webm';
    a.click();
    recorder = null;
  };

  document.body.classList.add('recording');
  wantRec = true;
  await restart();   // 從頭錄一輪乾淨的
};
</script>
</body>
</html>
